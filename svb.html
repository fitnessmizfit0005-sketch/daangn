구가 지정된 경우만 그 안에 작게\n- 달력이 나오면 2026년 10월 달력\n- 워터마크·로고·브랜드명 금지, 인물 얼굴은 자연스럽게 보이되 실존 인물과 닮지 않게\n- 각 이미지 앞에 '이미지N' 번호 붙이기\n\n이미지1: 썸네일 — 밝은 거실에서 거울을 보며 옆구리를 손으로 살짝 잡아보는 40대 한국 여성, 편안한 실내복, 따뜻한 자연광, 큰 글씨 문구 “뱃살·옆구리살” / “앉는 습관부터”\n\n이미지2: 사무실 책상 앞에서 등을 둥글게 구부리고 모니터를 보는 40대 한국 여성, 자연스러운 업무 장면\n\n이미지3: 사무실 의자에 엉덩이를 깊숙이 넣고 허리를 곧게 세워 앉은 40대 한국 여성의 옆모습, 발바닥이 바닥에 평평하게 닿은 모습\n\n이미지4: 사무실 창가에 서서 양팔을 위로 뻗고 몸을 옆으로 기울여 옆구리를 늘리는 40대 한국 여성, 밝은 자연광\n\n이미지5: 거실 의자에 바르게 앉아 배에 손을 얹고 천천히 숨을 내쉬는 40대 한국 여성, 차분한 분위기\n\n이미지6: 밝은 관리실 상담 테이블 옆에서 잠깐 일어나 기지개를 켜는 40대 후반 한국 여성 원장, 자연스러운 모습", "missing": 6}, {"id": "1016", "date": "2026-10-16", "label": "10/16", "dow": "금", "kind": "홍보", "when": "10/16(금) 오전 10시 30분 · 홍보글", "time": "오전 10:30", "title": "붓기와 군살이 같이 고민이라면, 1:1 하체·복부 바디관리", "copy": "다리는 붓고, 배와 옆구리는 군살이 잘 안 빠지고.\n이 두 가지를 같이 고민하시는 분들이 정말 많으세요.\n저희 매장에서는 순환과 체형 균형을 함께 보면서 하체·복부 바디관리를 1:1로 진행하고 있어요.\n\n관리 전에 AI 체형분석을 먼저 해요.\n골반이 어느 쪽으로 기울었는지, 체중이 어느 다리에 더 실리는지에 따라 붓기가 심한 쪽과 뭉치는 부위가 달라지거든요.\n\n하체 관리는 발목부터 허벅지까지 림프 흐름 방향을 따라 순환을 돕는 데 집중해요.\n오래 서 있거나 앉아 있는 분들이 관리 후 \"다리가 가벼워진 느낌\"이라고 많이 말씀하세요.\n\n복부·옆구리는 뭉친 부위를 풀어주고 순환을 돕는 바디슬리밍 관리로 진행해요.\n체형분석 결과에 맞춰 한쪽만 더 뭉친 부위가 있으면 그 부분을 더 신경 써드려요.\n\n회원님 한 분은 \"관리받는 날보다 그다음 날 아침에 차이가 느껴진다\"고 하시더라고요.\n변화는 사람마다 달라서, 저는 첫 상담 때 무리한 약속 대신 내 몸에 맞는 관리 주기를 같이 정해요.\n\n집에서 할 수 있는 다리 올리기, 발목 펌프 운동 같은 홈케어도 같이 알려드려요.\n관리실에서 받는 시간보다 집에서 보내는 시간이 훨씬 기니까요.\n\n하체 붓기나 뱃살 관리가 궁금하시면 채팅으로 \"바디\"라고 남겨주세요. 1:1 예약제라 원하시는 시간 먼저 맞춰드릴게요.\n\n· 스페이스뷰티 김천평화점 (1:1 관리 · 100% 예약제)\n· 김천시 평화길 89 1층 103호 (평화시장 공영주차장 맞은편)\n· 주차: 평화시장 공영주차장 30분 무료\n· 예약: 채팅 문의 또는 네이버에서 \"스페이스뷰티 김천평화점\" 검색 후 네이버 예약", "blocks": [{"t": "p", "v": "다리는 붓고, 배와 옆구리는 군살이 잘 안 빠지고.\n이 두 가지를 같이 고민하시는 분들이 정말 많으세요.\n저희 매장에서는 순환과 체형 균형을 함께 보면서 하체·복부 바디관리를 1:1로 진행하고 있어요."}, {"t": "noimg", "v": "썸네일 — 밝은 1:1 뷰티 관리실에서 관리 베드 옆에 서서 미소 짓는 40대 후반 한국 여성 원장, 깔끔한 유니폼, 따뜻한 자연광, 큰 글씨 문구 “붓기와 군살 고민” / “1:1 바디관리”", "n": "1"}, {"t": "p", "v": "관리 전에 AI 체형분석을 먼저 해요.\n골반이 어느 쪽으로 기울었는지, 체중이 어느 다리에 더 실리는지에 따라 붓기가 심한 쪽과 뭉치는 부위가 달라지거든요."}, {"t" 리 주기를 적어 보여주며 설명하는 40대 후반 한국 여성 원장과 고개를 끄덕이는 40대 한국 여성 고객\n\n이미지6: 관리를 마치고 가벼운 표정으로 관리실을 나서며 원장에게 손을 흔드는 30대 한국 여성 고객", "missing": 6}, {"id": "1019", "date": "2026-10-19", "label": "10/19", "dow": "월", "kind": "정보", "when": "10/19(월) 오전 10시 30분 · 정보글", "time": "오전 10:30", "title": "어깨가 늘 돌덩이처럼 뭉친다면, 고개 위치부터 확인해보세요", "copy": "어깨와 승모근이 늘 뭉치는 건 고개가 앞으로 나온 자세로 오래 지내면서 목·어깨 근육이 계속 머리를 붙잡고 있기 때문인 경우가 많아요.\n고개가 앞으로 몇 cm만 나와도 목과 어깨가 버텨야 하는 무게가 훨씬 커지거든요.\n\n상담 오시는 분들 중에 \"마사지를 받아도 이틀이면 다시 뭉쳐요\" 하시는 분들이 많으세요.\n체형분석을 해보면 고개가 앞으로 나오고 어깨가 안으로 말린 경우가 대부분이더라고요.\n\n① 휴대폰은 눈높이로\n휴대폰을 볼 때 고개를 숙이지 말고 휴대폰을 눈높이까지 올려주세요.\n팔꿈치를 다른 손으로 받치면 팔도 덜 힘들어요.\n\n② 턱 당기기 — 5초씩 10번\n등을 벽에 붙이고 서서 턱을 뒤로 살짝 당겨 뒤통수가 벽에 닿게 해요.\n고개를 숙이는 게 아니라 뒤로 미는 느낌으로 5초 버티고 풀어주세요.\n\n③ 가슴 열기 스트레칭 — 20초씩 2~3번\n문틀에 양 팔꿈치를 걸고 몸을 앞으로 천천히 기울이면 말린 가슴이 펴져요.\n어깨가 앞으로 말리는 습관이 있는 분께 특히 좋아요.\n\n저도 상담하고 관리하느라 고개를 숙이는 시간이 길어서, 틈날 때마다 턱 당기기를 해요.\n습관만 바꿔도 저녁에 어깨가 덜 무거운 게 느껴지더라고요.\n팔이 저리거나 두통이 계속된다면 병원 진료를 먼저 받아보세요.\n\n어깨 뭉침 때문에 고민이시면 채팅으로 \"어깨\"라고 남겨주세요. 체형분석으로 원인부터 같이 볼게요.\n\n· 스페이스뷰티 김천평화점 (1:1 관리 · 100% 예약제)\n· 김천시 평화길 89 1층 103호 (평화시장 공영주차장 맞은편)\n· 주차: 평화시장 공영주차장 30분 무료\n· 예약: 채팅 문의 또는 네이버에서 \"스페이스뷰티 김천평화점\" 검색 후 네이버 예약", "blocks": [{"t": "p", "v": "어깨와 승모근이 늘 뭉치는 건 고개가 앞으로 나온 자세로 오래 지내면서 목·어깨 근육이 계속 머리를 붙잡고 있기 때문인 경우가 많아요.\n고개가 앞으로 몇 cm만 나와도 목과 어깨가 버텨야 하는 무게가 훨씬 커지거든요."}, {"t": "noimg", "v": "썸네일 — 밝은 거실에서 한 손으로 뻐근한 어깨를 주무르는 40대 한국 여성, 따뜻한 자연광, 큰 글씨 문구 “늘 뭉치는 어깨” / “고개 위치부터”", "n": "1"}, {"t": "p", "v": "상담 오시는 분들 중에 \"마사지를 받아도 이틀이면 다시 뭉쳐요\" 하시는 분들이 많으세요.\n체형분석을 해보면 고개가 앞으로 나오고 어깨가 안으로 말린 경우가 대부분이더라고요."}, {"t": "noimg", "v": "소파에 앉아 고개를 앞으로 숙이고 휴대폰을 오래 들여다보는 40대 한국 여성의 옆모습, 자연스러운 생활 장면", "n": "2"}, {"t": "p", "v": "① 휴대폰은 눈높이로\n휴대폰을 볼 때 고개를 숙이지 말고 휴대폰을 눈높이까지 올려주세요.\n팔꿈치를 다른 손으로 받치면 팔도 덜 힘들어요."}, {"t": "noimg", "v": "소파에 바르게 앉아 휴대폰을 눈높이로 들고 다른 손으로 팔꿈치를 받친 40대 한국 여성, 밝은 실내", "n": "3"}, {"t": "p", "v": "② 턱 당기기 — 5초씩 10번\n등을 벽에 붙이고 서서 턱을 뒤로 살짝 당겨 뒤통수가 벽에 닿게 해요.\n고개를 숙이는 게 아니라 뒤로 미는 느낌으로 5초 버티고 풀어주세요."}, {"t": "noimg", "v": "하얀 벽에 등과 0회\n네발 자세에서 숨을 내쉬며 등을 둥글게 말고, 들이쉬며 천천히 펴주세요.\n등 근막을 위아래로 부드럽게 늘려주는 동작이에요.\n\n② 폼롤러로 등 위쪽 풀기 — 1~2분\n폼롤러를 날개뼈 아래에 두고 누워서 천천히 위아래로 굴려요.\n허리까지 내려가지 말고 등 위쪽에서만 굴리는 게 안전해요.\n\n③ 앉아서 상체 돌리기 — 좌우 5번씩\n의자에 바르게 앉아 양팔을 가슴 앞에 모으고 상체를 천천히 좌우로 돌려요.\n일하는 중간에도 할 수 있어서 틈틈이 해주시면 좋아요.\n\n저도 하루 관리를 마치면 폼롤러로 등을 꼭 풀고 자요.\n5분 정도인데 다음 날 아침 몸이 훨씬 덜 무거워요.\n통증이 날카롭거나 숨쉴 때 아프다면 무리하지 말고 병원 진료를 먼저 받아보세요.\n\n혼자 풀기 어려운 등은 채팅으로 \"등\"이라고 남겨주세요. 등 상태에 맞는 관리를 안내해드릴게요.\n\n· 스페이스뷰티 김천평화점 (1:1 관리 · 100% 예약제)\n· 김천시 평화길 89 1층 103호 (평화시장 공영주차장 맞은편)\n· 주차: 평화시장 공영주차장 30분 무료\n· 예약: 채팅 문의 또는 네이버에서 \"스페이스뷰티 김천평화점\" 검색 후 네이버 예약", "blocks": [{"t": "p", "v": "등이 뻐근하고 무거운 건 오래 같은 자세로 지내면서 등 근육과 그걸 감싼 근막이 굳어 있기 때문인 경우가 많아요.\n근막은 근육을 감싸는 얇은 막인데, 움직임이 적으면 뻣뻣해지면서 등 전체가 당기는 느낌이 들 수 있어요."}, {"t": "noimg", "v": "썸네일 — 밝은 거실에서 한 손을 등 뒤로 돌려 뻐근한 등을 만지는 40대 한국 여성, 따뜻한 자연광, 큰 글씨 문구 “뻐근한 등” / “집에서 푸는 법”", "n": "1"}, {"t": "p", "v": "상담 오시는 분들 중에 \"등이 무거워서 잠을 깊게 못 자요\" 하시는 분들도 계세요.\n등이 굳으면 어깨와 허리까지 같이 긴장하기 쉬워서, 저는 등을 바디 관리의 기초로 봐요."}, {"t": "noimg", "v": "침대에 누워 있다가 등을 짚으며 몸을 뒤척이는 40대 한국 여성, 이른 아침 은은한 빛", "n": "2"}, {"t": "p", "v": "① 고양이 자세 — 10회\n네발 자세에서 숨을 내쉬며 등을 둥글게 말고, 들이쉬며 천천히 펴주세요.\n등 근막을 위아래로 부드럽게 늘려주는 동작이에요."}, {"t": "noimg", "v": "거실 요가매트 위에서 네발 자세로 등을 둥글게 마는 고양이 자세를 하는 40대 한국 여성, 밝은 자연광", "n": "3"}, {"t": "p", "v": "② 폼롤러로 등 위쪽 풀기 — 1~2분\n폼롤러를 날개뼈 아래에 두고 누워서 천천히 위아래로 굴려요.\n허리까지 내려가지 말고 등 위쪽에서만 굴리는 게 안전해요."}, {"t": "noimg", "v": "요가매트 위에 폼롤러를 등 위쪽에 대고 누워 양손을 머리 뒤에 깍지 낀 40대 한국 여성", "n": "4"}, {"t": "p", "v": "③ 앉아서 상체 돌리기 — 좌우 5번씩\n의자에 바르게 앉아 양팔을 가슴 앞에 모으고 상체를 천천히 좌우로 돌려요.\n일하는 중간에도 할 수 있어서 틈틈이 해주시면 좋아요."}, {"t": "noimg", "v": "사무실 의자에 바르게 앉아 팔짱을 끼고 상체를 옆으로 천천히 돌리는 40대 한국 여성", "n": "5"}, {"t": "p", "v": "저도 하루 관리를 마치면 폼롤러로 등을 꼭 풀고 자요.\n5분 정도인데 다음 날 아침 몸이 훨씬 덜 무거워요.\n통증이 날카롭거나 숨쉴 때 아프다면 무리하지 말고 병원 진료를 먼저 받아보세요."}, {"t": "noimg", "v": "저녁 무렵 거실 매트 위에서 폼롤러를 옆에 두고 편안하게 스트레칭하는 40대 후반 한국 여성, 따뜻한 조명", "n": "6"}, {"t": "p", "v": "혼자 풀기 어려운 등은 채팅으로 \"등\"이라고 남겨주세요. 등 상태에 맞는 관리를 안내해드릴게요."}, {"t": "p", "v": "· 스페이스뷰티 김천평화점 (1:1 관 먹는 양을 갑자기 줄이면서 단백질까지 같이 줄어든 경우가 많더라고요.\n\n① 매 끼니 단백질 한 가지\n달걀, 두부, 생선, 살코기 중 한 가지는 매 끼니 챙겨주세요.\n한 번에 몰아 먹기보다 세 끼에 나눠 드시는 게 좋아요.\n\n② 아연·철분 챙기기\n굴·소고기·호박씨 같은 음식에는 아연이, 시금치·살코기·조개류에는 철분이 들어 있어요.\n철분은 비타민C가 많은 과일과 같이 먹으면 흡수에 도움이 돼요.\n\n③ 맵고 뜨거운 음식, 커피는 조금 줄이기\n매운 음식이나 뜨거운 국물을 자주 먹으면 두피에 열이 오르는 느낌이 드는 분들이 많아요.\n커피도 하루 한두 잔 정도로 줄이고, 그만큼 물을 나눠 마셔주세요.\n\n저도 바쁠 땐 끼니를 대충 때우곤 했는데, 아침에 달걀 하나라도 챙겨 먹기 시작하면서 머리카락 상태에 더 신경을 쓰게 됐어요.\n갑자기 많이 빠지거나 동그랗게 빠진 부위가 보인다면 병원 진료를 먼저 받아보세요.\n\n두피와 모발이 고민이시면 채팅으로 \"두피\"라고 남겨주세요. 두피 상태를 보고 관리와 생활 습관을 함께 안내해드릴게요.\n\n· 스페이스뷰티 김천평화점 (1:1 관리 · 100% 예약제)\n· 김천시 평화길 89 1층 103호 (평화시장 공영주차장 맞은편)\n· 주차: 평화시장 공영주차장 30분 무료\n· 예약: 채팅 문의 또는 네이버에서 \"스페이스뷰티 김천평화점\" 검색 후 네이버 예약", "blocks": [{"t": "p", "v": "머리카락과 두피도 결국 우리가 먹는 것으로 만들어져요.\n모발의 재료가 되는 단백질, 그리고 아연·철분 같은 영양소가 부족하면 머리카락이 가늘어지거나 쉽게 빠지는 느낌이 들 수 있어요."}, {"t": "noimg", "v": "썸네일 — 밝은 주방 식탁 위에 달걀, 두부, 생선구이, 견과류, 시금치나물이 담긴 건강한 한 끼, 따뜻한 아침 자연광, 큰 글씨 문구 “가늘어지는 머리카락” / “식탁부터 챙기기”", "n": "1"}, {"t": "p", "v": "상담하다 보면 다이어트 중에 머리카락이 부쩍 빠졌다는 분들이 꽤 계세요.\n먹는 양을 갑자기 줄이면서 단백질까지 같이 줄어든 경우가 많더라고요."}, {"t": "noimg", "v": "욕실 바닥 배수구 근처에 떨어진 머리카락을 보며 걱정스러운 표정을 짓는 30대 한국 여성, 밝은 욕실", "n": "2"}, {"t": "p", "v": "① 매 끼니 단백질 한 가지\n달걀, 두부, 생선, 살코기 중 한 가지는 매 끼니 챙겨주세요.\n한 번에 몰아 먹기보다 세 끼에 나눠 드시는 게 좋아요."}, {"t": "noimg", "v": "밝은 식탁 위 작은 접시에 담긴 삶은 달걀, 두부부침, 고등어구이, 자연스러운 한식 반찬 구성", "n": "3"}, {"t": "p", "v": "② 아연·철분 챙기기\n굴·소고기·호박씨 같은 음식에는 아연이, 시금치·살코기·조개류에는 철분이 들어 있어요.\n철분은 비타민C가 많은 과일과 같이 먹으면 흡수에 도움이 돼요."}, {"t": "noimg", "v": "나무 도마 위에 놓인 시금치, 소고기, 호박씨, 귤이 자연스럽게 배치된 장보기 재료, 밝은 주방", "n": "4"}, {"t": "p", "v": "③ 맵고 뜨거운 음식, 커피는 조금 줄이기\n매운 음식이나 뜨거운 국물을 자주 먹으면 두피에 열이 오르는 느낌이 드는 분들이 많아요.\n커피도 하루 한두 잔 정도로 줄이고, 그만큼 물을 나눠 마셔주세요."}, {"t": "noimg", "v": "카페 테이블 위 커피잔 대신 물컵을 집어 드는 30대 한국 여성의 손, 밝은 자연광", "n": "5"}, {"t": "p", "v": "저도 바쁠 땐 끼니를 대충 때우곤 했는데, 아침에 달걀 하나라도 챙겨 먹기 시작하면서 머리카락 상태에 더 신경을 쓰게 됐어요.\n갑자기 많이 빠지거나 동그랗게 빠진 부위가 보인다면 병원 진료를 먼저 받아보세요."}, {"t": "noimg", "v": "밝은 주방에서 삶은 달걀과 과일로 간단한 아침을 차리는 40대 후반 한국 여성, 편안한 분위기", "n": "6"}, {"t
