지)\n- 장소는 밝고 깔끔한 여성전용 피트니스센터, 회원은 40~60대 한국 여성, 트레이너는 30대 한국 남성\n- 이미지1만 썸네일: 사진 위에 따옴표 안 한글 문구를 굵고 크게, 한 글자도 바꾸지 말고 그대로 넣기\n- 이미지2부터는 글자를 넣지 말 것. 노트·달력처럼 원래 글씨가 있는 물건에 따옴표 문구가 지정된 경우만 그 안에 작게\n- 달력이 나오면 2026년 10월 달력\n- 워터마크·로고·브랜드명 금지, 인물 얼굴은 자연스럽게 보이되 실존 인물과 닮지 않게\n- 각 이미지 앞에 '이미지N' 번호 붙이기\n\n\n[제목] 50대에 운동 시작한다면, 이 3가지부터 확인하세요\n\n50대 이후 운동은 \"얼마나 세게\"보다 \"어디서부터\"가 먼저예요.\n시작 전에 내 몸 상태 3가지만 확인해도 다치지 않고 오래 갈 수 있어요.\n\n[이미지1: 썸네일 — 밝은 여성전용 피트니스센터에서 운동복 차림으로 웃으며 가볍게 스트레칭하는 50대 여성, 따뜻한 자연광, 큰 글씨 문구 “50대 운동 시작 전” / “이 3가지부터”]\n\n① 불편한 부위가 있는지 먼저 확인\n계단을 오를 때, 오래 앉았다 일어날 때 무릎·허리·어깨 중 시큰한 곳이 있나요?\n그 부위는 처음부터 무게를 싣는 동작보다 가볍게 움직이는 동작으로 시작하는 게 좋아요.\n통증이 심하거나 붓기가 있다면 운동보다 진료가 먼저예요.\n\n[이미지2: 아파트 계단을 오르다 한 손으로 무릎을 짚고 잠시 멈춰 선 50대 여성, 밝은 낮, 자연스러운 생활 장면]\n\n② 혈압·당뇨·복용 중인 약 확인\n혈압약이나 당뇨약을 드시는 분은 숨을 참고 힘을 주는 동작에서 어지러움을 느낄 수 있어요.\n다음 진료 때 주치의에게 \"운동해도 괜찮을까요?\" 한 번만 물어보세요.\n마음 편하게 시작하는 데 이만한 게 없어요.\n\n[이미지3: 밝은 병원 진료실에서 의사와 마주 앉아 편안하게 이야기 나누는 50대 여성, 책상 위 혈압계, 차분한 분위기]\n\n③ 지금 내 근력을 기록해두기\n의자에 앉아 팔짱을 끼고, 30초 동안 몇 번 일어났다 앉을 수 있는지 세어보세요.\n이 숫자를 적어두면 한 달 뒤 얼마나 좋아졌는지 비교하는 기준이 돼요.\n\n[이미지4: 여성전용 피트니스센터에서 팔짱을 끼고 의자에서 일어나는 동작을 하는 50대 여성과 옆에서 스톱워치를 들고 횟수를 세는 남성 트레이너, 밝은 자연광]\n\n처음 한 달은 주 2~3회, 한 번에 30~40분이면 충분해요.\n상담하다 보면 \"예전에 운동 좀 했었으니까\" 하고 처음부터 무게를 드셨다가 무릎이 시큰해져서 오시는 회원님들이 꽤 계세요.\n처음 몇 주는 몸을 길들이는 기간이라고 생각하시면 돼요.\n\n[이미지5: 운동 기록 노트에 오늘 운동한 내용을 적는 여성의 손, 옆에 물병과 수건, 노트에 짧은 문구 “30초 의자 일어나기”]\n\n미즈핏에서는 첫 수업 전에 불편한 부위, 생활 습관, 지금 근력을 먼저 확인해요.\n그 결과에 맞춰 운동 순서와 강도를 정하니까 운동이 처음이셔도 괜찮아요.\n여성전용 센터라 50~60대 회원님들도 편하게 다니고 계세요.\n\n[이미지6: 피트니스센터 상담 테이블에서 운동 기록지를 함께 보며 이야기 나누는 50대 여성 회원과 남성 트레이너, 편안하고 따뜻한 분위기]\n\n운동 시작 전에 내 몸 상태를 확인해보고 싶으시면 채팅으로 \"상담\"이라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)"}, {"id": "1009", "date": "2026-10-09", "label": "10/9", "dow": "금", "kind": "홍보", "when": "10/9(금·한글날) 오전 10시 30분 · 홍보글", "time": "오전 10:30", "title": "걷기가 지루했다면, 스텝박스 유산소 클래스", "copy": "혼자 하는 걷기나 러닝머신이 금방 지루해지셨다면 스텝박스 클래스가 잘 맞으실 거예요.\n음악에 맞춰 낮은 박스를 오르내리는 유산소 수업이라, 따라 하다 보면 1시간이 정말 금방 가요.\n\n스텝박스는 어떤 운동일까요?\n바닥에 놓인 낮은 박스를 음악 박자에 맞춰 오르고 내리는 유산소 운동이에요.\n처음엔 오르고 내리는 기본 스텝부터 배우고, 익숙해지면 동작을 하나씩 이어가요.\n\n이런 분께 추천해요\n① 걷기·러닝머신이 지루해서 오래 못 하셨던 분\n② 뛰는 운동은 무릎이 부담스러운 분\n③ 혼자보다 여럿이 함께해야 꾸준히 나오게 되는 분\n\n스텝박스는 오르내리는 동안 한 발은 늘 바닥이나 박스에 닿아 있어요.\n그래서 점프가 많은 운동보다 무릎에 오는 충격이 적은 편이고, 오를 때마다 허벅지와 엉덩이 근육을 계속 쓰게 돼요.\n땀 흘리는 유산소와 하체 운동을 한 번에 하는 셈이에요.\n\n상담하다 보면 \"동작을 못 따라가면 어떡하냐\"고 걱정하시는 분들이 정말 많으세요.\n처음에는 기본 스텝만 반복해도 충분히 땀이 나고, 몇 번 나오시면 음악만 들어도 다음 동작이 떠오른다고들 하세요.\n\n여성전용 클래스라 서툰 동작이나 운동복 차림 신경 쓰지 않고 편하게 하셔도 돼요.\n스텝박스 클래스는 평일 오전 10시부터 오후 4시 사이에 1시간씩, 스텝박스 유산소만 집중해서 진행해요.\n(오늘 한글날은 클래스가 쉬어요)\n\n원하시는 시간대에 자리가 있는지 채팅으로 \"스텝박스\"라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)", "blocks": [{"t": "p", "v": "혼자 하는 걷기나 러닝머신이 금방 지루해지셨다면 스텝박스 클래스가 잘 맞으실 거예요.\n음악에 맞춰 낮은 박스를 오르내리는 유산소 수업이라, 따라 하다 보면 1시간이 정말 금방 가요."}, {"t": "noimg", "v": "썸네일 — 밝은 여성전용 피트니스센터에서 낮은 스텝박스 위에 한 발을 올리고 함께 웃는 40~50대 여성 회원들, 활기찬 자연광, 큰 글씨 문구 “음악 따라 땀 흘리는” / “스텝박스 클래스”", "n": "1"}, {"t": "p", "v": "스텝박스는 어떤 운동일까요?\n바닥에 놓인 낮은 박스를 음악 박자에 맞춰 오르고 내리는 유산소 운동이에요.\n처음엔 오르고 내리는 기본 스텝부터 배우고, 익숙해지면 동작을 하나씩 이어가요."}, {"t": "noimg", "v": "피트니스센터 바닥에 나란히 놓인 낮은 스텝박스들과 운동화를 신은 한쪽 발이 박스 위에 올라가 있는 모습, 밝은 자연광", "n": "2"}, {"t": "p", "v": "이런 분께 추천해요\n① 걷기·러닝머신이 지루해서 오래 못 하셨던 분\n② 뛰는 운동은 무릎이 부담스러운 분\n③ 혼자보다 여럿이 함께해야 꾸준히 나오게 되는 분"}, {"t": "noimg", "v": "실내 러닝머신 위에서 지루한 표정으로 휴대폰을 보며 천천히 걷는 40대 여성, 자연스러운 생활 장면", "n": "3"}, {"t": "p", "v": "스텝박스는 오르내리는 동안 한 발은 늘 바닥이나 박스에 닿아 있어요.\n그래서 점프가 많은 운동보다 무릎에 오는 충격이 적은 편이고, 오를 때마다 허벅지와 엉덩이 근육을 계속 쓰게 돼요.\n땀 흘리는 유산소와 하체 운동을 한 번에 하는 셈이에요."}, {"t": "noimg", "v": "스텝박스 위로 오르는 여성의 하체 클로즈업, 운동화 신은 발 전체가 박스 위에 안정적으로 올라간 모습, 밝은 피트니스센터", "n": "4"}, {"t": "p", "v": "상담하다 보면 \"동작을 못 따라가면 어떡하냐\"고 걱정하시는 분들이 정말 많으세요.\n처음에는 기본 스텝만 반복해도 충분히 땀이 나고, 몇  클래스\n\n혼자 하는 걷기나 러닝머신이 금방 지루해지셨다면 스텝박스 클래스가 잘 맞으실 거예요.\n음악에 맞춰 낮은 박스를 오르내리는 유산소 수업이라, 따라 하다 보면 1시간이 정말 금방 가요.\n\n[이미지1: 썸네일 — 밝은 여성전용 피트니스센터에서 낮은 스텝박스 위에 한 발을 올리고 함께 웃는 40~50대 여성 회원들, 활기찬 자연광, 큰 글씨 문구 “음악 따라 땀 흘리는” / “스텝박스 클래스”]\n\n스텝박스는 어떤 운동일까요?\n바닥에 놓인 낮은 박스를 음악 박자에 맞춰 오르고 내리는 유산소 운동이에요.\n처음엔 오르고 내리는 기본 스텝부터 배우고, 익숙해지면 동작을 하나씩 이어가요.\n\n[이미지2: 피트니스센터 바닥에 나란히 놓인 낮은 스텝박스들과 운동화를 신은 한쪽 발이 박스 위에 올라가 있는 모습, 밝은 자연광]\n\n이런 분께 추천해요\n① 걷기·러닝머신이 지루해서 오래 못 하셨던 분\n② 뛰는 운동은 무릎이 부담스러운 분\n③ 혼자보다 여럿이 함께해야 꾸준히 나오게 되는 분\n\n[이미지3: 실내 러닝머신 위에서 지루한 표정으로 휴대폰을 보며 천천히 걷는 40대 여성, 자연스러운 생활 장면]\n\n스텝박스는 오르내리는 동안 한 발은 늘 바닥이나 박스에 닿아 있어요.\n그래서 점프가 많은 운동보다 무릎에 오는 충격이 적은 편이고, 오를 때마다 허벅지와 엉덩이 근육을 계속 쓰게 돼요.\n땀 흘리는 유산소와 하체 운동을 한 번에 하는 셈이에요.\n\n[이미지4: 스텝박스 위로 오르는 여성의 하체 클로즈업, 운동화 신은 발 전체가 박스 위에 안정적으로 올라간 모습, 밝은 피트니스센터]\n\n상담하다 보면 \"동작을 못 따라가면 어떡하냐\"고 걱정하시는 분들이 정말 많으세요.\n처음에는 기본 스텝만 반복해도 충분히 땀이 나고, 몇 번 나오시면 음악만 들어도 다음 동작이 떠오른다고들 하세요.\n\n[이미지5: 거울이 있는 그룹 운동 공간 맨 앞에서 스텝 동작을 시범 보이는 30대 남성 트레이너와 그를 따라 하는 40~60대 여성 회원들, 활기찬 분위기]\n\n여성전용 클래스라 서툰 동작이나 운동복 차림 신경 쓰지 않고 편하게 하셔도 돼요.\n스텝박스 클래스는 평일 오전 10시부터 오후 4시 사이에 1시간씩, 스텝박스 유산소만 집중해서 진행해요.\n(오늘 한글날은 클래스가 쉬어요)\n\n[이미지6: 수업을 마치고 스텝박스 옆에서 수건으로 땀을 닦으며 함께 웃는 40~50대 여성 회원들, 밝고 즐거운 분위기]\n\n원하시는 시간대에 자리가 있는지 채팅으로 \"스텝박스\"라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)"}, {"id": "1012", "date": "2026-10-12", "label": "10/12", "dow": "월", "kind": "정보", "when": "10/12(월) 오전 10시 30분 · 정보글", "time": "오전 10:30", "title": "무릎이 시큰할 때, 운동을 쉬어야 할까요?", "copy": "무릎이 시큰하다고 무조건 쉬기보다는, 무릎에 체중이 덜 실리는 운동으로 허벅지 힘을 길러주는 게 도움이 되는 경우가 많아요.\n허벅지 앞쪽 근육이 무릎으로 가는 충격을 같이 받아주기 때문이에요.\n\n상담하다 보면 \"무릎 때문에 계단이 무서워서\" 운동을 아예 멈추셨던 분들이 꽤 계세요.\n그런데 움직이지 않는 동안 허벅지 힘이 더 빠지면서 계단이 점점 더 부담스러워지는 경우도 많더라고요.\n\n① 의자에 앉아 다리 펴기 — 10회씩 2~3세트\n의자에 앉아 한쪽 다리를 쭉 펴고 3초 버틴 뒤 천천히 내려요.\n무릎에 체중이 실리지 않아서 무릎이 불편한 분도 부담 없이 시작할 수 있어요.\n\n② 실내자전거 — 가벼운 강도로 10~15분\n페달을 돌리는 동안 무릎이 부드럽게 접혔다 펴지면서 허벅지 근육을 쓰게 돼요.\n처음엔 숨이 살짝 찰 정도의 가벼운 강도면 충분해요.\n\n③ 누워서 다리 들기 — 10회씩 2세트\n바닥에 누워 무릎을 편 채로 한쪽 다리를 천천히 들었다 내려요.\n대신 깊게 쪼그려 앉기, 계단 빠르게 오르내리기, 점프처럼 무릎에 순간적으로 힘이 실리는 동작은 잠시 미뤄두세요.\n\n운동한 다음 날 무릎이 더 아프거나 붓는다면 강도가 높았다는 신호예요.\n가만히 있어도 아프거나 열감·붓기가 계속된다면 운동보다 진료가 먼저예요.\n\n미즈핏에서는 처음에 무릎이 어떤 동작에서 불편한지부터 확인하고, 부담 적은 동작으로 시작해 조금씩 범위를 넓혀가요.\n여성전용 센터라 내 속도에 맞춰 천천히 따라오셔도 괜찮아요.\n\n무릎 때문에 운동을 망설이고 계셨다면 채팅으로 \"무릎\"이라고 남겨주세요. 어떤 동작부터 하면 좋을지 알려드릴게요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)", "blocks": [{"t": "p", "v": "무릎이 시큰하다고 무조건 쉬기보다는, 무릎에 체중이 덜 실리는 운동으로 허벅지 힘을 길러주는 게 도움이 되는 경우가 많아요.\n허벅지 앞쪽 근육이 무릎으로 가는 충격을 같이 받아주기 때문이에요."}, {"t": "noimg", "v": "썸네일 — 밝은 여성전용 피트니스센터에서 의자에 앉아 무릎에 손을 얹고 미소 짓는 50대 여성, 따뜻한 자연광, 큰 글씨 문구 “무릎 시큰할 때” / “이렇게 운동하세요”", "n": "1"}, {"t": "p", "v": "상담하다 보면 \"무릎 때문에 계단이 무서워서\" 운동을 아예 멈추셨던 분들이 꽤 계세요.\n그런데 움직이지 않는 동안 허벅지 힘이 더 빠지면서 계단이 점점 더 부담스러워지는 경우도 많더라고요."}, {"t": "noimg", "v": "아파트 계단 난간을 잡고 한 칸씩 조심스럽게 내려가는 50대 여성, 밝은 낮, 자연스러운 생활 장면", "n": "2"}, {"t": "p", "v": "① 의자에 앉아 다리 펴기 — 10회씩 2~3세트\n의자에 앉아 한쪽 다리를 쭉 펴고 3초 버틴 뒤 천천히 내려요.\n무릎에 체중이 실리지 않아서 무릎이 불편한 분도 부담 없이 시작할 수 있어요."}, {"t": "noimg", "v": "여성전용 피트니스센터에서 의자에 앉아 한쪽 다리를 앞으로 쭉 펴는 50대 여성과 옆에서 무릎 높이에 손을 대고 자세를 봐주는 30대 남성 트레이너, 밝은 자연광", "n": "3"}, {"t": "p", "v": "② 실내자전거 — 가벼운 강도로 10~15분\n페달을 돌리는 동안 무릎이 부드럽게 접혔다 펴지면서 허벅지 근육을 쓰게 돼요.\n처음엔 숨이 살짝 찰 정도의 가벼운 강도면 충분해요."}, {"t": "noimg", "v": "밝은 피트니스센터에서 실내자전거를 가볍게 타며 웃는 50대 여성, 창가 자연광", "n": "4"}, {"t": "p", "v": "③ 누워서 다리 들기 — 10회씩 2세트\n바닥에 누워 무릎을 편 채로 한쪽 다리를 천천히 들었다 내려요.\n대신 깊게 쪼그려 앉기, 계단 빠르게 오르내리기, 점프처럼 무릎에 순간적으로 힘이 실리는 동작은 잠시 미뤄두세요."}, {"t": "noimg", "v": "운동 매트 위에 누워 무릎을 편 채 한쪽 다리를 천천히 들어 올리는 50대 여성, 밝은 피트니스센터", "n": "5"}, {"t": "p", "v": "운동한 다음 날 무릎이 더 아프거나 붓는다면 강도가 높았다는 신호예요.\n가만히 있어도 아프거나 열감·붓기가 계속된다면 운동보다 진료가 먼저예요."}, {"t": "noimg", "v": "피트니스센터 상담 테이블에서 무릎 상태를 이야기하는 50대 여성 회원과 노트에 메모하며 듣는 30대 남성 트레이너, 편안한 분위기", 멈추셨던 분들이 꽤 계세요.\n그런데 움직이지 않는 동안 허벅지 힘이 더 빠지면서 계단이 점점 더 부담스러워지는 경우도 많더라고요.\n\n[이미지2: 아파트 계단 난간을 잡고 한 칸씩 조심스럽게 내려가는 50대 여성, 밝은 낮, 자연스러운 생활 장면]\n\n① 의자에 앉아 다리 펴기 — 10회씩 2~3세트\n의자에 앉아 한쪽 다리를 쭉 펴고 3초 버틴 뒤 천천히 내려요.\n무릎에 체중이 실리지 않아서 무릎이 불편한 분도 부담 없이 시작할 수 있어요.\n\n[이미지3: 여성전용 피트니스센터에서 의자에 앉아 한쪽 다리를 앞으로 쭉 펴는 50대 여성과 옆에서 무릎 높이에 손을 대고 자세를 봐주는 30대 남성 트레이너, 밝은 자연광]\n\n② 실내자전거 — 가벼운 강도로 10~15분\n페달을 돌리는 동안 무릎이 부드럽게 접혔다 펴지면서 허벅지 근육을 쓰게 돼요.\n처음엔 숨이 살짝 찰 정도의 가벼운 강도면 충분해요.\n\n[이미지4: 밝은 피트니스센터에서 실내자전거를 가볍게 타며 웃는 50대 여성, 창가 자연광]\n\n③ 누워서 다리 들기 — 10회씩 2세트\n바닥에 누워 무릎을 편 채로 한쪽 다리를 천천히 들었다 내려요.\n대신 깊게 쪼그려 앉기, 계단 빠르게 오르내리기, 점프처럼 무릎에 순간적으로 힘이 실리는 동작은 잠시 미뤄두세요.\n\n[이미지5: 운동 매트 위에 누워 무릎을 편 채 한쪽 다리를 천천히 들어 올리는 50대 여성, 밝은 피트니스센터]\n\n운동한 다음 날 무릎이 더 아프거나 붓는다면 강도가 높았다는 신호예요.\n가만히 있어도 아프거나 열감·붓기가 계속된다면 운동보다 진료가 먼저예요.\n\n[이미지6: 피트니스센터 상담 테이블에서 무릎 상태를 이야기하는 50대 여성 회원과 노트에 메모하며 듣는 30대 남성 트레이너, 편안한 분위기]\n\n미즈핏에서는 처음에 무릎이 어떤 동작에서 불편한지부터 확인하고, 부담 적은 동작으로 시작해 조금씩 범위를 넓혀가요.\n여성전용 센터라 내 속도에 맞춰 천천히 따라오셔도 괜찮아요.\n\n무릎 때문에 운동을 망설이고 계셨다면 채팅으로 \"무릎\"이라고 남겨주세요. 어떤 동작부터 하면 좋을지 알려드릴게요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)"}, {"id": "1014", "date": "2026-10-14", "label": "10/14", "dow": "수", "kind": "정보", "when": "10/14(수) 오후 7시 · 정보글", "time": "오후 7:00", "title": "50대부터는 체중계 숫자보다 근력이 먼저인 이유", "copy": "나이가 들수록 같은 몸무게라도 근육은 줄고 지방은 늘기 쉬워요.\n그래서 50대부터는 \"몇 kg 뺐나\"보다 \"근력이 얼마나 붙었나\"를 먼저 보는 게 건강에 더 도움이 돼요.\n\n① 같은 몸무게, 전혀 다른 몸\n근육은 지방보다 부피가 작아서, 체중이 그대로여도 근육이 늘면 허리둘레와 옷 핏이 달라져요.\n반대로 굶어서 체중만 줄이면 근육이 같이 빠져 오히려 쉽게 피곤해질 수 있어요.\n\n② 근력은 일상에서 먼저 느껴져요\n계단 오를 때 숨이 덜 차고, 장바구니가 덜 무겁고, 바닥에서 일어나기가 수월해져요.\n허벅지·엉덩이 힘이 붙으면 넘어질 위험을 줄이는 데도 도움이 돼요.\n\n③ 근력운동은 주 2회 이상\n보건복지부 신체활동 지침에서도 성인에게 근력운동을 주 2일 이상 권하고 있어요.\n처음엔 한 번에 20~30분, 맨몸이나 가벼운 기구로 시작해도 충분해요.\n\n체중계 대신 이렇게 확인해보세요\n한 달에 한 번 같은 시간에 허리둘레를 재고, 의자에서 30초 동안 몇 번 일어날 수 있는지 세어보세요.\n계단이나 장바구니가 예전보다 가볍게 느껴지는지도 좋은 신호예요.\n\n상담 오시는 분들 중에 \"한 달 했는데 체중이 그대로라 그만둘까 고민\"이라는 분들이 꽤 계세요.\n그럴 땐 허리둘레를 재보시라고 말씀드리는데, 숫자는 그대로여도 허리둘레나 옷 핏이 달라진 걸 느끼시는 경우가 많더라고요.\n\n미즈핏에서는 체중만 보지 않고 근력과 생활 속 체감 변화를 같이 확인하면서 운동 강도를 조절해요.\n여성전용 센터라 근력운동이 처음인 50~60대 회원님들도 부담 없이 시작하세요.\n\n체중은 안 빠지는데 운동을 계속해야 할지 고민이시라면 채팅으로 \"근력\"이라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)", "blocks": [{"t": "p", "v": "나이가 들수록 같은 몸무게라도 근육은 줄고 지방은 늘기 쉬워요.\n그래서 50대부터는 \"몇 kg 뺐나\"보다 \"근력이 얼마나 붙었나\"를 먼저 보는 게 건강에 더 도움이 돼요."}, {"t": "noimg", "v": "썸네일 — 밝은 여성전용 피트니스센터 거울 앞에서 가벼운 덤벨을 들고 자신 있게 웃는 50대 여성, 따뜻한 자연광, 큰 글씨 문구 “체중계 숫자보다” / “근력이 먼저”", "n": "1"}, {"t": "p", "v": "① 같은 몸무게, 전혀 다른 몸\n근육은 지방보다 부피가 작아서, 체중이 그대로여도 근육이 늘면 허리둘레와 옷 핏이 달라져요.\n반대로 굶어서 체중만 줄이면 근육이 같이 빠져 오히려 쉽게 피곤해질 수 있어요."}, {"t": "noimg", "v": "밝은 욕실에서 체중계 위에 올라 숫자를 내려다보며 고개를 갸웃하는 50대 여성, 자연스러운 생활 장면", "n": "2"}, {"t": "p", "v": "② 근력은 일상에서 먼저 느껴져요\n계단 오를 때 숨이 덜 차고, 장바구니가 덜 무겁고, 바닥에서 일어나기가 수월해져요.\n허벅지·엉덩이 힘이 붙으면 넘어질 위험을 줄이는 데도 도움이 돼요."}, {"t": "noimg", "v": "양손에 장바구니를 들고 가벼운 걸음으로 계단을 오르는 50대 여성, 밝은 낮, 자연스러운 생활 장면", "n": "3"}, {"t": "p", "v": "③ 근력운동은 주 2회 이상\n보건복지부 신체활동 지침에서도 성인에게 근력운동을 주 2일 이상 권하고 있어요.\n처음엔 한 번에 20~30분, 맨몸이나 가벼운 기구로 시작해도 충분해요."}, {"t": "noimg", "v": "여성전용 피트니스센터에서 레그프레스 머신으로 운동하는 50대 여성과 옆에서 무릎 방향을 봐주는 30대 남성 트레이너, 밝은 자연광", "n": "4"}, {"t": "p", "v": "체중계 대신 이렇게 확인해보세요\n한 달에 한 번 같은 시간에 허리둘레를 재고, 의자에서 30초 동안 몇 번 일어날 수 있는지 세어보세요.\n계단이나 장바구니가 예전보다 가볍게 느껴지는지도 좋은 신호예요."}, {"t": "noimg", "v": "밝은 실내에서 줄자로 허리둘레를 재며 미소 짓는 50대 여성, 운동복 차림", "n": "5"}, {"t": "p", "v": "상담 오시는 분들 중에 \"한 달 했는데 체중이 그대로라 그만둘까 고민\"이라는 분들이 꽤 계세요.\n그럴 땐 허리둘레를 재보시라고 말씀드리는데, 숫자는 그대로여도 허리둘레나 옷 핏이 달라진 걸 느끼시는 경우가 많더라고요."}, {"t": "noimg", "v": "운동 기록 노트에 허리둘레를 적는 여성의 손, 옆에 줄자와 물병, 노트에 짧은 문구 “10월 허리둘레”", "n": "6"}, {"t": "p", "v": "미즈핏에서는 체중만 보지 않고 근력과 생활 속 체감 변화를 같이 확인하면서 운동 강도를 조절해요.\n여성전용 센터라 근력운동이 처음인 50~60대 회원님들도 부담 없이 시작하세요."}, {"t": "p", "v": "체중은 안 빠지는데 운동을 계속해야 할지 고민이시라면 채팅으로  얼굴도 익어서, 한 번 빠지면 서로 안부를 묻게 되더라고요.\n\n[이미지5: 운동 매트 위에서 함께 쿨다운 스트레칭을 하며 서로 웃는 40~50대 여성 회원들, 따뜻하고 친근한 분위기]\n\n수업 시간: 평일 오후 4시 · 5시 · 6시 · 7시 (각 1시간, 마지막 수업 8시 종료)\n아이 하원 후나 퇴근길에 들르기 좋은 시간대예요.\n여성전용 센터라 편한 차림으로 오시면 돼요.\n\n[이미지6: 해 질 무렵 창밖 노을이 보이는 피트니스센터 입구로 운동복 차림에 가방을 메고 들어서는 40대 여성, 따뜻한 조명]\n\n원하시는 시간대에 자리가 있는지 채팅으로 \"그룹\"이라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)"}, {"id": "1019", "date": "2026-10-19", "label": "10/19", "dow": "월", "kind": "정보", "when": "10/19(월) 오전 10시 30분 · 정보글", "time": "오전 10:30", "title": "운동 처음이라면 주 몇 번, 몇 분이 적당할까요?", "copy": "운동을 처음 시작한다면 첫 한두 달은 주 2~3회, 한 번에 40분~1시간이면 충분해요.\n매일 하는 것보다 하루씩 쉬어가며 꾸준히 하는 쪽이 몸에 무리가 덜 가고 오래 가요.\n\n① 주 2~3회, 하루 걸러서\n근력운동을 하고 나면 근육이 회복하는 시간이 필요해요.\n월·수·금처럼 하루씩 쉬어주면 다음 운동 때 더 좋은 컨디션으로 할 수 있어요.\n\n② 시작은 몸풀기 10분\n관절을 돌리고 가볍게 걸으면서 몸을 데우면 다치는 걸 줄일 수 있어요.\n바로 무거운 운동부터 하면 몸이 놀라서 다음 날 더 뻐근해지기 쉬워요.\n\n③ 근력운동 20~30분, 큰 근육 위주로\n허벅지·엉덩이·등처럼 큰 근육을 쓰는 동작부터 하면 같은 시간에도 운동 효과가 좋아요.\n마지막 10~20분은 숨이 약간 찰 정도의 유산소와 스트레칭으로 마무리하세요.\n\n④ 늘리는 건 2~4주 뒤부터\n운동 다음 날 뻐근함이 줄고 동작이 익숙해지면 그때 횟수나 무게를 조금씩 늘려도 돼요.\n보건복지부 신체활동 지침에서도 성인에게 근력운동 주 2일 이상, 중간 강도 유산소 주 150분 이상을 권하고 있어요.\n\n상담하다 보면 의욕이 넘쳐서 첫 주에 매일 나오셨다가, 둘째 주에 근육통으로 며칠 못 나오시는 분들이 꼭 계세요.\n처음엔 \"조금 아쉽다\" 싶을 때 멈추는 게 오히려 오래 가는 비결이더라고요.\n\n미즈핏 그룹PT는 1시간 동안 웨이트 30분, 유산소 30분으로 구성돼 있어서 주 2~3회 나오시면 초보자에게 딱 맞는 운동량이 돼요.\n여성전용 센터라 운동이 처음이셔도 편하게 시작하실 수 있어요.\n\n나한테 맞는 운동 횟수가 궁금하시면 채팅으로 \"초보\"라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)", "blocks": [{"t": "p", "v": "운동을 처음 시작한다면 첫 한두 달은 주 2~3회, 한 번에 40분~1시간이면 충분해요.\n매일 하는 것보다 하루씩 쉬어가며 꾸준히 하는 쪽이 몸에 무리가 덜 가고 오래 가요."}, {"t": "noimg", "v": "썸네일 — 밝은 여성전용 피트니스센터에서 운동 매트 옆에 물병을 들고 웃는 40대 여성, 따뜻한 자연광, 큰 글씨 문구 “운동 처음이면” / “주 2~3회면 충분”", "n": "1"}, {"t": "p", "v": "① 주 2~3회, 그라미가 그려져 있고 옆에 운동화와 물병, 밝은 자연광\n\n이미지3: 여성전용 피트니스센터에서 팔을 크게 돌리며 몸풀기 동작을 하는 40대 여성, 밝은 자연광\n\n이미지4: 가벼운 덤벨을 들고 스쿼트를 하는 40대 여성과 옆에서 자세를 봐주는 30대 남성 트레이너, 밝은 피트니스센터\n\n이미지5: 운동 매트 위에서 다리를 뻗고 스트레칭으로 운동을 마무리하는 40대 여성, 편안한 표정\n\n이미지6: 거실 소파에 앉아 허벅지를 주무르며 멋쩍게 웃는 40대 여성, 자연스러운 생활 장면", "missing": 6, "gptfull": "아래 당근 소식글 본문 속 [이미지N: 설명] 자리마다 그 설명에 맞는 이미지를 1장씩, 순서대로 만들어줘.\n조건:\n- 전부 4:3 가로 비율, 실제 사진처럼 보이는 실사 톤 (일러스트·3D·카드뉴스 느낌 금지)\n- 장소는 밝고 깔끔한 여성전용 피트니스센터, 회원은 40~60대 한국 여성, 트레이너는 30대 한국 남성\n- 이미지1만 썸네일: 사진 위에 따옴표 안 한글 문구를 굵고 크게, 한 글자도 바꾸지 말고 그대로 넣기\n- 이미지2부터는 글자를 넣지 말 것. 노트·달력처럼 원래 글씨가 있는 물건에 따옴표 문구가 지정된 경우만 그 안에 작게\n- 달력이 나오면 2026년 10월 달력\n- 워터마크·로고·브랜드명 금지, 인물 얼굴은 자연스럽게 보이되 실존 인물과 닮지 않게\n- 각 이미지 앞에 '이미지N' 번호 붙이기\n\n\n[제목] 운동 처음이라면 주 몇 번, 몇 분이 적당할까요?\n\n운동을 처음 시작한다면 첫 한두 달은 주 2~3회, 한 번에 40분~1시간이면 충분해요.\n매일 하는 것보다 하루씩 쉬어가며 꾸준히 하는 쪽이 몸에 무리가 덜 가고 오래 가요.\n\n[이미지1: 썸네일 — 밝은 여성전용 피트니스센터에서 운동 매트 옆에 물병을 들고 웃는 40대 여성, 따뜻한 자연광, 큰 글씨 문구 “운동 처음이면” / “주 2~3회면 충분”]\n\n① 주 2~3회, 하루 걸러서\n근력운동을 하고 나면 근육이 회복하는 시간이 필요해요.\n월·수·금처럼 하루씩 쉬어주면 다음 운동 때 더 좋은 컨디션으로 할 수 있어요.\n\n[이미지2: 책상 위에 놓인 2026년 10월 탁상 달력, 월·수·금 날짜마다 동그라미가 그려져 있고 옆에 운동화와 물병, 밝은 자연광]\n\n② 시작은 몸풀기 10분\n관절을 돌리고 가볍게 걸으면서 몸을 데우면 다치는 걸 줄일 수 있어요.\n바로 무거운 운동부터 하면 몸이 놀라서 다음 날 더 뻐근해지기 쉬워요.\n\n[이미지3: 여성전용 피트니스센터에서 팔을 크게 돌리며 몸풀기 동작을 하는 40대 여성, 밝은 자연광]\n\n③ 근력운동 20~30분, 큰 근육 위주로\n허벅지·엉덩이·등처럼 큰 근육을 쓰는 동작부터 하면 같은 시간에도 운동 효과가 좋아요.\n마지막 10~20분은 숨이 약간 찰 정도의 유산소와 스트레칭으로 마무리하세요.\n\n[이미지4: 가벼운 덤벨을 들고 스쿼트를 하는 40대 여성과 옆에서 자세를 봐주는 30대 남성 트레이너, 밝은 피트니스센터]\n\n④ 늘리는 건 2~4주 뒤부터\n운동 다음 날 뻐근함이 줄고 동작이 익숙해지면 그때 횟수나 무게를 조금씩 늘려도 돼요.\n보건복지부 신체활동 지침에서도 성인에게 근력운동 주 2일 이상, 중간 강도 유산소 주 150분 이상을 권하고 있어요.\n\n[이미지5: 운동 매트 위에서 다리를 뻗고 스트레칭으로 운동을 마무리하는 40대 여성, 편안한 표정]\n\n상담하다 보면 의욕이 넘쳐서 첫 주에 매일 나오셨다가, 둘째 주에 근육통으로 며칠 못 나오시는 분들이 꼭 계세요.\n처음엔 \"조금 아쉽다\" 싶을 때 멈추는 게 오히려 오래 가는 비결이더라고요.\n\n[이미지6: 거실 소파에 앉아 허벅지를 주무르며 멋쩍게 웃는 40대 여성, 자연스러운 생활 장면]\n\n미즈핏 그룹PT는 1시간 동안 웨이트 30분, 유산소 30분으로 구성돼 있어서 주 2~3회 나오시면 초보자에게 딱 맞는 운동량이 돼요.\n여성전용 센터라 운동이 처음이셔도 편하게 시작하실 수 있어요.\n\n나한테 맞는 운동 횟수가 궁금하시면 채팅으로 \"초보\"라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)"}, {"id": "1021", "date": "2026-10-21", "label": "10/21", "dow": "수", "kind": "정보", "when": "10/21(수) 오후 7시 · 정보글", "time": "오후 7:00", "title": "스텝박스 운동이 중년 여성에게 잘 맞는 이유 3가지", "copy": "스텝박스는 낮은 박스를 음악에 맞춰 오르내리는 유산소 운동이에요.\n땀을 내는 유산소와 하체 근력운동을 한 번에 할 수 있고, 점프가 적어 관절 부담이 적은 편이라 중년 여성분들께 특히 잘 맞아요.\n\n① 유산소와 하체 근력을 한 번에\n박스에 오를 때마다 허벅지와 엉덩이 근육을 쓰게 돼요.\n숨이 차오르는 유산소를 하면서 하체 힘까지 같이 기를 수 있어요.\n\n② 관절 부담이 적은 편\n오르내리는 동안 한 발은 늘 바닥이나 박스에 닿아 있어요.\n그래서 뛰는 운동보다 무릎과 발목에 오는 충격이 적은 편이에요.\n\n③ 지루하지 않아서 꾸준히 하게 돼요\n음악에 맞춰 동작을 이어가다 보면 시간이 금방 가요.\n혼자 걷기나 러닝머신이 지루해서 그만두셨던 분들도 오래 하시는 경우가 많아요.\n\n이것만 지키면 더 안전해요\n박스 위에는 앞꿈치만 걸치지 말고 발 전체를 올려주세요.\n내려올 때는 쿵 소리가 나지 않게 뒤꿈치까지 사뿐히 내려오고, 무릎이 안쪽으로 모이지 않게 발끝 방향을 유지해 주세요.\n\n수업하다 보면 러닝머신 10분도 지루해하시던 회원님들이 스텝박스 1시간은 \"벌써 끝났어요?\" 하실 때가 많아요.\n음악이 있고 옆에서 같이 하는 사람이 있으니 힘든 걸 덜 느끼시는 것 같더라고요.\n\n미즈핏은 평일 오전 10시부터 오후 4시 사이에 1시간짜리 스텝박스 유산소 클래스를 운영하고 있어요.\n그룹PT 수업의 유산소 시간에도 스텝박스를 함께 해요.\n\n스텝박스 수업이 궁금하시면 채팅으로 \"스텝박스\"라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)", "blocks": [{"t": "p", "v": "스텝박스는 낮은 박스를 음악에 맞춰 오르내리는 유산소 운동이에요.\n땀을 내는 유산소와 하체 근력운동을 한 번에 할 수 있고, 점프가 적어 관절 부담이 적은 편이라 중년 여성분들께 특히 잘 맞아요."}, {"t": "noimg", "v": "썸네일 — 밝은 여성전용 피트니스센터에서 스텝박스 위로 함께 오르며 웃는 50대 여성 회원들, 활기찬 자연광, 큰 글씨 문구 “스텝박스가” / “중년 여성에게 맞는 이유”", "n": "1"}, {"t": "p", "v": "① 유산소와 하체 근력을 한 번에\n박스에 오를 때마다 허벅지와 엉덩이 근육을 쓰게 돼요.\n숨이 차오르는 유산소를 하면서 하체 힘까지 같이 기를 수 있어요."}, {"t": "noimg", "v": "스텝박스 위로 힘차게 한 발을 딛고 오르는 50대 여성, 운동복 차림, 밝은 피트니스센터", "n": "2"}, {"t": "p", "v": "② 관절 부담이 적은 편\n오르내리는 동안 한 발은 늘 바닥이나 박스에 닿아 있어요.\n그래서 뛰는 운동보다 무릎과 발목에 오는 충격이 적은 편이에요."}, {"t": "noimg", "v": "운동화를 신은 발 전체가 스텝박스 위에 안정적으로 올라가 있는 클로즈업, 밝은 자연광", "n": "3"}, {"t": "p", "v": "③ 지루하 센터, 회원은 40~60대 한국 여성, 트레이너는 30대 한국 남성\n- 이미지1만 썸네일: 사진 위에 따옴표 안 한글 문구를 굵고 크게, 한 글자도 바꾸지 말고 그대로 넣기\n- 이미지2부터는 글자를 넣지 말 것. 노트·달력처럼 원래 글씨가 있는 물건에 따옴표 문구가 지정된 경우만 그 안에 작게\n- 달력이 나오면 2026년 10월 달력\n- 워터마크·로고·브랜드명 금지, 인물 얼굴은 자연스럽게 보이되 실존 인물과 닮지 않게\n- 각 이미지 앞에 '이미지N' 번호 붙이기\n\n\n[제목] 스텝박스 운동이 중년 여성에게 잘 맞는 이유 3가지\n\n스텝박스는 낮은 박스를 음악에 맞춰 오르내리는 유산소 운동이에요.\n땀을 내는 유산소와 하체 근력운동을 한 번에 할 수 있고, 점프가 적어 관절 부담이 적은 편이라 중년 여성분들께 특히 잘 맞아요.\n\n[이미지1: 썸네일 — 밝은 여성전용 피트니스센터에서 스텝박스 위로 함께 오르며 웃는 50대 여성 회원들, 활기찬 자연광, 큰 글씨 문구 “스텝박스가” / “중년 여성에게 맞는 이유”]\n\n① 유산소와 하체 근력을 한 번에\n박스에 오를 때마다 허벅지와 엉덩이 근육을 쓰게 돼요.\n숨이 차오르는 유산소를 하면서 하체 힘까지 같이 기를 수 있어요.\n\n[이미지2: 스텝박스 위로 힘차게 한 발을 딛고 오르는 50대 여성, 운동복 차림, 밝은 피트니스센터]\n\n② 관절 부담이 적은 편\n오르내리는 동안 한 발은 늘 바닥이나 박스에 닿아 있어요.\n그래서 뛰는 운동보다 무릎과 발목에 오는 충격이 적은 편이에요.\n\n[이미지3: 운동화를 신은 발 전체가 스텝박스 위에 안정적으로 올라가 있는 클로즈업, 밝은 자연광]\n\n③ 지루하지 않아서 꾸준히 하게 돼요\n음악에 맞춰 동작을 이어가다 보면 시간이 금방 가요.\n혼자 걷기나 러닝머신이 지루해서 그만두셨던 분들도 오래 하시는 경우가 많아요.\n\n[이미지4: 음악에 맞춰 팔을 위로 뻗으며 스텝 동작을 함께 하는 40~60대 여성 회원들, 즐겁고 활기찬 분위기]\n\n이것만 지키면 더 안전해요\n박스 위에는 앞꿈치만 걸치지 말고 발 전체를 올려주세요.\n내려올 때는 쿵 소리가 나지 않게 뒤꿈치까지 사뿐히 내려오고, 무릎이 안쪽으로 모이지 않게 발끝 방향을 유지해 주세요.\n\n[이미지5: 스텝박스 앞에서 30대 남성 트레이너가 50대 여성 회원에게 무릎과 발끝 방향을 손으로 가리키며 설명하는 모습, 밝은 피트니스센터]\n\n수업하다 보면 러닝머신 10분도 지루해하시던 회원님들이 스텝박스 1시간은 \"벌써 끝났어요?\" 하실 때가 많아요.\n음악이 있고 옆에서 같이 하는 사람이 있으니 힘든 걸 덜 느끼시는 것 같더라고요.\n\n[이미지6: 수업을 마치고 스텝박스 옆에서 물을 마시며 이야기 나누는 50대 여성 회원들, 편안한 분위기]\n\n미즈핏은 평일 오전 10시부터 오후 4시 사이에 1시간짜리 스텝박스 유산소 클래스를 운영하고 있어요.\n그룹PT 수업의 유산소 시간에도 스텝박스를 함께 해요.\n\n스텝박스 수업이 궁금하시면 채팅으로 \"스텝박스\"라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)"}, {"id": "1023", "date": "2026-10-23", "label": "10/23", "dow": "금", "kind": "홍보", "when": "10/23(금) 오전 10시 30분 · 홍보글", "time": "오전 10:30", "title": "평일 낮 1시간, 스텝박스 유산소 클래스", "copy": "걷기나 러닝머신이 지루해서 오래 못 하셨다면 미즈핏 스텝박스 클래스를 추천해요.\n낮은 박스를 음악에 맞춰 오르내리는 유산소 수업인데, 1시간이 정말 금방 지나가요.\n\n스텝박스는 어떤 운동일까요?\n바닥에 놓인 낮은 박스를 음악 박자에 맞춰 오르고 내리는 유산소 운동이에요.\n기본 스텝부터 천천히 시작해서 익숙해지면 동작을 하나씩 이어가요.\n\n이런 분께 잘 맞아요\n① 걷기·러닝머신이 지루해서 그만두셨던 분\n② 뛰는 운동은 무릎이 부담스러운 분\n③ 혼자보다 여럿이 함께해야 꾸준히 나오게 되는 분\n\n스텝박스가 좋은 이유\n박스에 오를 때마다 허벅지와 엉덩이 근육을 쓰기 때문에 땀 흘리는 유산소와 하체 근력운동을 같이 할 수 있어요.\n한 발은 늘 바닥이나 박스에 닿아 있어서 점프가 많은 운동보다 무릎에 오는 충격도 적은 편이에요.\n\n처음 오시는 분들이 가장 많이 걱정하시는 게 \"동작을 못 따라가면 어떡하지\"예요.\n기본 스텝부터 천천히 시작하니 걱정하지 않으셔도 돼요.\n몇 번 나오시면 음악만 들어도 다음 동작이 떠오른다고들 하시더라고요.\n\n수업 시간: 평일 오전 10시 ~ 오후 4시 사이, 1시간 수업\n스텝박스 유산소만 1시간 집중해서 진행해요.\n여성전용 클래스라 서툰 동작이나 운동복 차림 신경 쓰지 않고 편하게 하셔도 돼요.\n\n원하시는 시간대에 자리가 있는지 채팅으로 \"스텝박스\"라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)", "blocks": [{"t": "p", "v": "걷기나 러닝머신이 지루해서 오래 못 하셨다면 미즈핏 스텝박스 클래스를 추천해요.\n낮은 박스를 음악에 맞춰 오르내리는 유산소 수업인데, 1시간이 정말 금방 지나가요."}, {"t": "noimg", "v": "썸네일 — 밝은 여성전용 피트니스센터에서 스텝박스 위에 한 발을 올리고 팔을 뻗으며 웃는 40~50대 여성 회원들, 활기찬 자연광, 큰 글씨 문구 “평일 낮 1시간” / “스텝박스 클래스”", "n": "1"}, {"t": "p", "v": "스텝박스는 어떤 운동일까요?\n바닥에 놓인 낮은 박스를 음악 박자에 맞춰 오르고 내리는 유산소 운동이에요.\n기본 스텝부터 천천히 시작해서 익숙해지면 동작을 하나씩 이어가요."}, {"t": "noimg", "v": "피트니스센터 바닥에 나란히 놓인 낮은 스텝박스들, 수업 시작 전 깔끔하게 정돈된 운동 공간, 밝은 자연광", "n": "2"}, {"t": "p", "v": "이런 분께 잘 맞아요\n① 걷기·러닝머신이 지루해서 그만두셨던 분\n② 뛰는 운동은 무릎이 부담스러운 분\n③ 혼자보다 여럿이 함께해야 꾸준히 나오게 되는 분"}, {"t": "noimg", "v": "거실 창가에서 운동화 끈을 묶으며 운동 갈 준비를 하는 40대 여성, 밝은 아침 자연광", "n": "3"}, {"t": "p", "v": "스텝박스가 좋은 이유\n박스에 오를 때마다 허벅지와 엉덩이 근육을 쓰기 때문에 땀 흘리는 유산소와 하체 근력운동을 같이 할 수 있어요.\n한 발은 늘 바닥이나 박스에 닿아 있어서 점프가 많은 운동보다 무릎에 오는 충격도 적은 편이에요."}, {"t": "noimg", "v": "스텝박스 위로 오르는 여성들의 하체가 나란히 보이는 장면, 운동화 신은 발이 박스 위에 안정적으로 올라간 모습", "n": "4"}, {"t": "p", "v": "처음 오시는 분들이 가장 많이 걱정하시는 게 \"동작을 못 따라가면 어떡하지\"예요.\n기본 스텝부터 천천히 시작하니 걱정하지 않으셔도 돼요.\n몇 번 나오시면 음악만 들어도 다음 동작이 떠오른다고들 하시더라고요."}, {"t": "noimg", "v": "거울이 있는 그룹 운동 공간 맨 앞에서 스텝 동작을 시범 보이는 30대 남성 트레이너와 그를 따라 하며 웃는 40~60대 여성 회원들", "n": "5"}, {"t": "p", "v": "수업 시간: 평일 오전 10시 ~ 오후 4시 사이, 1시간 수업\n스텝박스 유산소만 1시간 집중해서 진행해 히 시작해서 익숙해지면 동작을 하나씩 이어가요.\n\n[이미지2: 피트니스센터 바닥에 나란히 놓인 낮은 스텝박스들, 수업 시작 전 깔끔하게 정돈된 운동 공간, 밝은 자연광]\n\n이런 분께 잘 맞아요\n① 걷기·러닝머신이 지루해서 그만두셨던 분\n② 뛰는 운동은 무릎이 부담스러운 분\n③ 혼자보다 여럿이 함께해야 꾸준히 나오게 되는 분\n\n[이미지3: 거실 창가에서 운동화 끈을 묶으며 운동 갈 준비를 하는 40대 여성, 밝은 아침 자연광]\n\n스텝박스가 좋은 이유\n박스에 오를 때마다 허벅지와 엉덩이 근육을 쓰기 때문에 땀 흘리는 유산소와 하체 근력운동을 같이 할 수 있어요.\n한 발은 늘 바닥이나 박스에 닿아 있어서 점프가 많은 운동보다 무릎에 오는 충격도 적은 편이에요.\n\n[이미지4: 스텝박스 위로 오르는 여성들의 하체가 나란히 보이는 장면, 운동화 신은 발이 박스 위에 안정적으로 올라간 모습]\n\n처음 오시는 분들이 가장 많이 걱정하시는 게 \"동작을 못 따라가면 어떡하지\"예요.\n기본 스텝부터 천천히 시작하니 걱정하지 않으셔도 돼요.\n몇 번 나오시면 음악만 들어도 다음 동작이 떠오른다고들 하시더라고요.\n\n[이미지5: 거울이 있는 그룹 운동 공간 맨 앞에서 스텝 동작을 시범 보이는 30대 남성 트레이너와 그를 따라 하며 웃는 40~60대 여성 회원들]\n\n수업 시간: 평일 오전 10시 ~ 오후 4시 사이, 1시간 수업\n스텝박스 유산소만 1시간 집중해서 진행해요.\n여성전용 클래스라 서툰 동작이나 운동복 차림 신경 쓰지 않고 편하게 하셔도 돼요.\n\n[이미지6: 수업을 마치고 땀을 닦으며 서로 하이파이브하는 40~50대 여성 회원들, 밝고 즐거운 분위기]\n\n원하시는 시간대에 자리가 있는지 채팅으로 \"스텝박스\"라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)"}, {"id": "1026", "date": "2026-10-26", "label": "10/26", "dow": "월", "kind": "정보", "when": "10/26(월) 오전 10시 30분 · 정보글", "time": "오전 10:30", "title": "허리가 불편할 때도 할 수 있는 하체운동 3가지", "copy": "허리가 불편하다면 무거운 무게를 드는 하체운동보다, 허리를 곧게 세운 채로 할 수 있는 가벼운 하체운동부터 시작하는 게 좋아요.\n허벅지와 엉덩이 힘이 붙으면 허리가 혼자 버티던 부담을 나눠 받는 데 도움이 돼요.\n\n허리가 불편하다고 하체운동을 아예 피하시던 회원님들이 꽤 계세요.\n그런데 상담해 보면 오래 앉아 지내면서 엉덩이와 허벅지 힘이 약해진 경우가 많더라고요.\n가벼운 동작부터 하나씩 늘려가는 게 가장 안전한 방법이에요.\n\n① 의자 스쿼트 — 10회씩 2~3세트\n의자 앞에 서서 가슴을 편 채로 엉덩이를 뒤로 빼며 앉듯이 내려가요.\n의자에 살짝 닿으면 바로 일어나세요. 의자가 있어서 너무 깊이 앉지 않게 도와줘요.\n\n② 브릿지 — 10회씩 2세트\n바닥에 누워 무릎을 세우고, 엉덩이를 천천히 들어 2~3초 버틴 뒤 내려요.\n허리를 꺾어서 높이 드는 게 아니라 엉덩이에 힘이 들어가는 높이까지만 들어주세요.\n\n③ 옆으로 누워 다리 들기 — 양쪽 10회씩\n옆으로 누워 위쪽 다리를 천천히 들었다 내려요.\n엉덩이 옆쪽 근육을 쓰는 동작이라 골반을 잡아주는 힘을 기르는 데 좋아요.\n\n당분간 피하면 좋은 것\n허리를 숙인 채 무거운 물건 들기, 반동을 주며 빠르게 하는 동작은 잠시 미뤄두세요.\n통증이 심하거나 다리까지 저리는 느낌이 있다면 운동보다 진료가 먼저예요.\n\n미즈핏에서는 처음에 허리가 어떤 자세에서 불편한지부터 확인하고, 그에 맞춰 동작과 무게를 정해요.\n개인PT는 1:1로 바닥에 누워 무릎을 세우고, 엉덩이를 천천히 들어 2~3초 버틴 뒤 내려요.\n허리를 꺾어서 높이 드는 게 아니라 엉덩이에 힘이 들어가는 높이까지만 들어주세요.\n\n[이미지4: 운동 매트 위에 누워 무릎을 세우고 엉덩이를 들어 올리는 브릿지 동작을 하는 50대 여성, 밝은 피트니스센터]\n\n③ 옆으로 누워 다리 들기 — 양쪽 10회씩\n옆으로 누워 위쪽 다리를 천천히 들었다 내려요.\n엉덩이 옆쪽 근육을 쓰는 동작이라 골반을 잡아주는 힘을 기르는 데 좋아요.\n\n[이미지5: 운동 매트 위에 옆으로 누워 위쪽 다리를 천천히 들어 올리는 50대 여성, 차분한 분위기]\n\n당분간 피하면 좋은 것\n허리를 숙인 채 무거운 물건 들기, 반동을 주며 빠르게 하는 동작은 잠시 미뤄두세요.\n통증이 심하거나 다리까지 저리는 느낌이 있다면 운동보다 진료가 먼저예요.\n\n[이미지6: 피트니스센터 상담 테이블에서 허리 상태를 이야기하는 50대 여성 회원과 노트에 메모하며 듣는 30대 남성 트레이너, 편안한 분위기]\n\n미즈핏에서는 처음에 허리가 어떤 자세에서 불편한지부터 확인하고, 그에 맞춰 동작과 무게를 정해요.\n개인PT는 1:1로 내 상태에 맞춰 진행하고, 주말·공휴일에도 가능해요.\n\n허리 때문에 운동을 망설이셨다면 채팅으로 \"허리\"라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)"}, {"id": "1028", "date": "2026-10-28", "label": "10/28", "dow": "수", "kind": "정보", "when": "10/28(수) 오후 7시 · 정보글", "time": "오후 7:00", "title": "운동해도 살이 안 빠진다면, 이것부터 확인", "copy": "운동해도 살이 잘 안 빠지는 가장 흔한 이유는 운동한 만큼 더 먹게 되거나, 근력운동 없이 유산소만 하는 경우예요.\n운동 순서도 중요한데, 근력운동을 먼저 하고 유산소를 나중에 하는 게 일반적으로 권장되는 순서예요.\n\n① 운동한 만큼 더 먹고 있지 않나요?\n운동 후에는 배가 더 고프고 \"오늘 운동했으니까\" 하는 마음이 들기 쉬워요.\n1시간 걸어서 쓴 에너지는 빵 하나, 음료 한 잔으로 금방 채워질 수 있어요.\n\n② 유산소만 하고 있지 않나요?\n걷기만 오래 하면 근육은 잘 늘지 않아요.\n근육이 줄면 가만히 있을 때 쓰는 에너지도 줄어서 같은 양을 먹어도 살이 잘 안 빠지는 몸이 되기 쉬워요.\n\n③ 체중계만 보고 있지 않나요?\n근력운동을 시작하면 체중보다 허리둘레나 옷 핏이 먼저 달라지는 경우가 많아요.\n체중계 숫자가 그대로라고 2~3주 만에 그만두기엔 아까워요.\n\n운동 순서는 이렇게\n몸풀기 5~10분 → 근력운동 30분 → 유산소 20~30분 순서로 해보세요.\n힘이 남아 있을 때 근력운동을 해야 바른 자세로 제대로 할 수 있고, 유산소는 그다음에 해도 충분해요.\n\n상담 오시는 분들 중에 \"주 5일 1시간씩 걷는데 그대로예요\"라는 분들이 정말 많으세요.\n그럴 때 먹는 것과 운동 순서를 같이 살펴보면, 대부분 둘 중 하나에서 답이 나오더라고요.\n\n미즈핏 그룹PT는 워밍업과 웨이트 30분, 유산소와 쿨다운 30분 순서로 진행돼요.\n식단관리도 함께 도와드리니 혼자 고민하지 않으셔도 돼요.\n\n운동해도 그대로라 답답하셨다면 채팅으로 \"다이어트\"라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)", "b 정된 경우만 그 안에 작게\n- 달력이 나오면 2026년 10월 달력\n- 워터마크·로고·브랜드명 금지, 인물 얼굴은 자연스럽게 보이되 실존 인물과 닮지 않게\n- 각 이미지 앞에 '이미지N' 번호 붙이기\n\n이미지1: 썸네일 — 밝은 욕실에서 체중계를 내려다보며 고민하는 표정의 40대 여성, 운동복 차림, 따뜻한 자연광, 큰 글씨 문구 “운동해도” / “살이 안 빠진다면”\n\n이미지2: 운동복 차림으로 카페 테이블에 앉아 조각 케이크와 달콤한 음료를 앞에 두고 웃는 40대 여성, 자연스러운 생활 장면\n\n이미지3: 공원 산책로를 혼자 빠르게 걷는 40대 여성, 이른 저녁 노을빛\n\n이미지4: 밝은 실내에서 줄자로 허리둘레를 재며 살짝 놀란 듯 웃는 40대 여성, 운동복 차림\n\n이미지5: 여성전용 피트니스센터에서 웨이트 기구로 근력운동을 하는 40대 여성과 옆에서 자세를 봐주는 30대 남성 트레이너, 뒤쪽에 실내자전거와 스텝박스, 밝은 자연광\n\n이미지6: 밝은 주방 식탁 위에 잡곡밥, 생선구이, 나물, 샐러드가 담긴 소박한 한 끼와 물 한 잔, 아침 자연광", "missing": 6, "gptfull": "아래 당근 소식글 본문 속 [이미지N: 설명] 자리마다 그 설명에 맞는 이미지를 1장씩, 순서대로 만들어줘.\n조건:\n- 전부 4:3 가로 비율, 실제 사진처럼 보이는 실사 톤 (일러스트·3D·카드뉴스 느낌 금지)\n- 장소는 밝고 깔끔한 여성전용 피트니스센터, 회원은 40~60대 한국 여성, 트레이너는 30대 한국 남성\n- 이미지1만 썸네일: 사진 위에 따옴표 안 한글 문구를 굵고 크게, 한 글자도 바꾸지 말고 그대로 넣기\n- 이미지2부터는 글자를 넣지 말 것. 노트·달력처럼 원래 글씨가 있는 물건에 따옴표 문구가 지정된 경우만 그 안에 작게\n- 달력이 나오면 2026년 10월 달력\n- 워터마크·로고·브랜드명 금지, 인물 얼굴은 자연스럽게 보이되 실존 인물과 닮지 않게\n- 각 이미지 앞에 '이미지N' 번호 붙이기\n\n\n[제목] 운동해도 살이 안 빠진다면, 이것부터 확인\n\n운동해도 살이 잘 안 빠지는 가장 흔한 이유는 운동한 만큼 더 먹게 되거나, 근력운동 없이 유산소만 하는 경우예요.\n운동 순서도 중요한데, 근력운동을 먼저 하고 유산소를 나중에 하는 게 일반적으로 권장되는 순서예요.\n\n[이미지1: 썸네일 — 밝은 욕실에서 체중계를 내려다보며 고민하는 표정의 40대 여성, 운동복 차림, 따뜻한 자연광, 큰 글씨 문구 “운동해도” / “살이 안 빠진다면”]\n\n① 운동한 만큼 더 먹고 있지 않나요?\n운동 후에는 배가 더 고프고 \"오늘 운동했으니까\" 하는 마음이 들기 쉬워요.\n1시간 걸어서 쓴 에너지는 빵 하나, 음료 한 잔으로 금방 채워질 수 있어요.\n\n[이미지2: 운동복 차림으로 카페 테이블에 앉아 조각 케이크와 달콤한 음료를 앞에 두고 웃는 40대 여성, 자연스러운 생활 장면]\n\n② 유산소만 하고 있지 않나요?\n걷기만 오래 하면 근육은 잘 늘지 않아요.\n근육이 줄면 가만히 있을 때 쓰는 에너지도 줄어서 같은 양을 먹어도 살이 잘 안 빠지는 몸이 되기 쉬워요.\n\n[이미지3: 공원 산책로를 혼자 빠르게 걷는 40대 여성, 이른 저녁 노을빛]\n\n③ 체중계만 보고 있지 않나요?\n근력운동을 시작하면 체중보다 허리둘레나 옷 핏이 먼저 달라지는 경우가 많아요.\n체중계 숫자가 그대로라고 2~3주 만에 그만두기엔 아까워요.\n\n[이미지4: 밝은 실내에서 줄자로 허리둘레를 재며 살짝 놀란 듯 웃는 40대 여성, 운동복 차림]\n\n운동 순서는 이렇게\n몸풀기 5~10분 → 근력운동 30분 → 유산소 20~30분 순서로 해보세요.\n힘이 남아 있을 때 근력운동을 해야 바른 자세로 제대로 할 수 있고, 유산소는 그다음에 해도 충분해요.\n\n[이미지5: 여성전용 피트니스센터에서 웨이트 기구로 근력운동을 하는 40대 여성과 옆에서 자세를 봐주는 30대 남성 트레이너, 뒤쪽에 실내자전거와 스텝박스, 밝은 자연광]\n\n상담 오시는 분들 중에 \"주 5일 1시간씩 걷는데 그대로예요\"라는 분들이 정말 많으세요.\n그럴 때 먹는 것과 운동 순서를 같이 살펴보면, 대부분 둘 중 하나에서 답이 나오더라고요.\n\n[이미지6: 밝은 주방 식탁 위에 잡곡밥, 생선구이, 나물, 샐러드가 담긴 소박한 한 끼와 물 한 잔, 아침 자연광]\n\n미즈핏 그룹PT는 워밍업과 웨이트 30분, 유산소와 쿨다운 30분 순서로 진행돼요.\n식단관리도 함께 도와드리니 혼자 고민하지 않으셔도 돼요.\n\n운동해도 그대로라 답답하셨다면 채팅으로 \"다이어트\"라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)"}, {"id": "1030", "date": "2026-10-30", "label": "10/30", "dow": "금", "kind": "홍보", "when": "10/30(금) 오전 10시 30분 · 홍보글", "time": "오전 10:30", "title": "결과까지 함께 가는 미즈핏 개인PT", "copy": "운동을 여러 번 시작했는데 매번 흐지부지됐다면, 방법보다 \"함께 끌고 갈 사람\"이 필요했던 걸 수도 있어요.\n미즈핏 개인PT는 처음 상담부터 변화를 확인하는 순간까지 한 과정을 같이 걸어가는 수업이에요.\n\n개인PT는 이렇게 진행돼요\n① 무료 상담 — 생활 패턴, 불편한 곳, 지금까지 운동했던 경험과 목표를 먼저 들어요.\n② 나에게 맞춘 계획 — 체력과 자세를 확인하고, 운동 순서와 강도를 내 몸에 맞춰 정해요.\n③ 매 수업 기록하고 조정 — 수업마다 기록을 남기고, 몸이 달라지는 걸 같이 확인하며 다음 단계로 넘어가요.\n\n회원님 이야기 하나\n\"PT를 세 번 받아봤는데 세 번 다 3개월을 못 넘겼어요.\"\n40대 회원님이 첫 상담에서 하신 말씀이에요.\n이야기를 들어보니 의지 문제가 아니었어요. 한 달에 5kg처럼 너무 빠른 목표, 탄수화물을 한 번에 끊는 식단, 몸이 아플 만큼 센 강도가 매번 같았더라고요.\n\n그래서 목표부터 바꿨어요. 몇 kg이 아니라 \"3개월 꾸준히 나오기\".\n처음 한 달은 강도를 낮추고, 식단은 잡곡밥으로 바꾸고 야식만 줄이는 것부터 시작했어요.\n대신 \"지난주보다 스쿼트 자세가 안정됐어요\" 같은 작은 변화를 매번 같이 짚었어요.\n3개월 뒤 체중은 7kg 줄었고, 옷도 한 사이즈 작은 걸 입게 됐다고 좋아하셨어요. (변화는 사람마다 달라요)\n그런데 제일 기억에 남는 건 이 말이었어요. \"이제 운동하는 날이 기다려져요.\"\n\n회원님 이야기 둘\n\"어깨 운동을 열심히 했는데 승모근만 커지고 어깨선은 그대로예요.\"\n홈트·요가·필라테스까지 다 해보신 여성 회원님이었어요.\n자세를 보니 어깨가 앞으로 말려 있고, 팔을 들 때마다 목 쪽 근육이 먼저 움직이는 습관이 있었어요.\n무게를 늘리는 대신 각도와 동작 순서를 다시 잡았고, 8주 뒤 회원님이 웃으면서 그러시더라고요.\n\"저는 어깨 운동한 줄 알았는데, 그동안 거의 목 운동이었네요.\"\n\n저는 운동을 \"가르치는 것\"보다 회원님이 원하는 결과까지 \"같이 가는 것\"이 개인PT라고 생각해요.\n그래서 처음 몇 주는 무게보다 내 몸이 어디가 약하고 어디가 불편한지 찾는 데 더 시간을 써요.\n방향이 맞으면 결과는 따라오더라고요.\n\n수업 안내\n· 1회 1시간, 1:1 또는 2:1\n· 2:1은 함께 오시는 두 분의 체형과 체력이 비슷할 때 진행해요 (가족·친구와 같이 배우고 싶은 분께 추천)\n· 평일은 물론 주말·공휴일에도 가능 (추석·설 당일 제외)\n· 30회 등록 시 유산소 Zone 무료 이용\n\n11월부터 제대로 시작해보고 싶으시다면 채팅으로 \"개인PT\"라고 남겨주세요. 상담 시간부터 맞춰드릴게요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~2 const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function copyText(btn, text){

  catch(e){ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand('copy')}catch(_){} t.remove(); }

}
