*{box-sizing:border-box}

kind": "정보", "when": "10/14(수) 오후 7시 · 정보글", "title": "50대부터는 체중계 숫자보다 근력이 먼저인 이유", "copy": "나이가 들수록 같은 몸무게라도 근육은 줄고 지방은 늘기 쉬워요.\n그래서 50대부터는 \"몇 kg 뺐나\"보다 \"근력이 얼마나 붙었나\"를 먼저 보는 게 건강에 더 도움이 돼요.\n\n① 같은 몸무게, 전혀 다른 몸\n근육은 지방보다 부피가 작아서, 체중이 그대로여도 근육이 늘면 허리둘레와 옷 핏이 달라져요.\n반대로 굶어서 체중만 줄이면 근육이 같이 빠져 오히려 쉽게 피곤해질 수 있어요.\n\n② 근력은 일상에서 먼저 느껴져요\n계단 오를 때 숨이 덜 차고, 장바구니가 덜 무겁고, 바닥에서 일어나기가 수월해져요.\n허벅지·엉덩이 힘이 붙으면 넘어질 위험을 줄이는 데도 도움이 돼요.\n\n③ 근력운동은 주 2회 이상\n보건복지부 신체활동 지침에서도 성인에게 근력운동을 주 2일 이상 권하고 있어요.\n처음엔 한 번에 20~30분, 맨몸이나 가벼운 기구로 시작해도 충분해요.\n\n상담 오시는 분들 중에 \"한 달 했는데 체중이 그대로라 그만둘까 고민\"이라는 분들이 꽤 계세요.\n그럴 땐 체중계 말고 허리둘레를 재보시라고 말씀드리는데, 숫자는 그대로여도 허리둘레나 옷 핏이 달라진 걸 느끼시는 경우가 많더라고요.\n\n미즈핏에서는 체중만 보지 않고 근력과 생활 속 체감 변화를 같이 확인하면서 운동 강도를 조절해요.\n여성전용 센터라 근력운동이 처음인 50~60대 회원님들도 부담 없이 시작하세요.\n\n체중은 안 빠지는데 운동을 계속해야 할지 고민이시라면 채팅으로 \"근력\"이라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)", "blocks": [{"t": "p", "v": "나이가 들수록 같은 몸무게라도 근육은 줄고 지방은 늘기 쉬워요.\n그래서 50대부터는 \"몇 kg 뺐나\"보다 \"근력이 얼마나 붙었나\"를 먼저 보는 게 건강에 더 도움이 돼요."}, {"t": "img", "v": "img/1014/1.png", "n": "1"}, {"t": "p", "v": "① 같은 몸무게, 전혀 다른 몸\n근육은 지방보다 부피가 작아서, 체중이 그대로여도 근육이 늘면 허리둘레와 옷 핏이 달라져요.\n반대로 굶어서 체중만 줄이면 근육이 같이 빠져 오히려 쉽게 피곤해질 수 있어요."}, {"t": "p", "v": "② 근력은 일상에서 먼저 느껴져요\n계단 오를 때 숨이 덜 차고, 장바구니가 덜 무겁고, 바닥에서 일어나기가 수월해져요.\n허벅지·엉덩이 힘이 붙으면 넘어질 위험을 줄이는 데도 도움이 돼요."}, {"t": "p", "v": "③ 근력운동은 주 2회 이상\n보건복지부 신체활동 지침에서도 성인에게 근력운동을 주 2일 이상 권하고 있어요.\n처음엔 한 번에 20~30분, 맨몸이나 가벼운 기구로 시작해도 충분해요."}, {"t": "img", "v": "img/1014/2.png", "n": "2"}, {"t": "p", "v": "상담 오시는 분들 중에 \"한 달 했는데 체중이 그대로라 그만둘까 고민\"이라는 분들이 꽤 계세요.\n그럴 땐 체중계 말고 허리둘레를 재보시라고 말씀드리는데, 숫자는 그대로여도 허리둘레나 옷 핏이 달라진 걸 느끼시는 경우가 많더라고요."}, {"t": "noimg", "v": "이미지3 — GPT", "n": "3"}, {"t": "p", "v": "미즈핏에서는 체중만 보지 않고 근력과 생활 속 체감 변화를 같이 확인하면서 운동 강도를 조절해요.\n여성전용 센터라 근력운동이 처음인 50~60대 회원님들도 부담 없이 시작하세요."}, {"t": "noimg", "v": "이미지4 — GPT 또는 실제 센터 사진", "n": "4"}, {"  "정보", "when": "10/21(수) 오후 7시 · 정보글", "title": "스텝박스 운동이 중년 여성에게 잘 맞는 이유 3가지", "copy": "스텝박스는 낮은 박스를 음악에 맞춰 오르내리는 유산소 운동이에요.\n땀을 내는 유산소와 하체 근력운동을 한 번에 할 수 있고, 점프가 적어 관절 부담이 적은 편이라 중년 여성분들께 특히 잘 맞아요.\n\n① 유산소와 하체 근력을 한 번에\n박스에 오를 때마다 허벅지와 엉덩이 근육을 쓰게 돼요.\n숨이 차오르는 유산소를 하면서 하체 힘까지 같이 기를 수 있어요.\n\n② 관절 부담이 적은 편\n오르내리는 동안 한 발은 늘 바닥이나 박스에 닿아 있어요.\n그래서 뛰는 운동보다 무릎과 발목에 오는 충격이 적은 편이에요.\n\n③ 지루하지 않아서 꾸준히 하게 돼요\n음악에 맞춰 동작을 이어가다 보면 시간이 금방 가요.\n혼자 걷기나 러닝머신이 지루해서 그만두셨던 분들도 오래 하시는 경우가 많아요.\n\n이것만 지키면 더 안전해요\n박스 위에는 앞꿈치만 걸치지 말고 발 전체를 올려주세요.\n내려올 때는 쿵 소리가 나지 않게 뒤꿈치까지 사뿐히 내려오고, 무릎이 안쪽으로 모이지 않게 발끝 방향을 유지해 주세요.\n\n수업하다 보면 러닝머신 10분도 지루해하시던 회원님들이 스텝박스 1시간은 \"벌써 끝났어요?\" 하실 때가 많아요.\n음악이 있고 옆에서 같이 하는 사람이 있으니 힘든 걸 덜 느끼시는 것 같더라고요.\n\n미즈핏은 평일 오전 10시부터 오후 4시 사이에 1시간짜리 스텝박스 유산소 클래스를 운영하고 있어요.\n그룹PT 수업의 유산소 시간에도 스텝박스를 함께 해요.\n\n스텝박스 수업이 궁금하시면 채팅으로 \"스텝박스\"라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)", "blocks": [{"t": "p", "v": "스텝박스는 낮은 박스를 음악에 맞춰 오르내리는 유산소 운동이에요.\n땀을 내는 유산소와 하체 근력운동을 한 번에 할 수 있고, 점프가 적어 관절 부담이 적은 편이라 중년 여성분들께 특히 잘 맞아요."}, {"t": "img", "v": "img/1021/1.png", "n": "1"}, {"t": "p", "v": "① 유산소와 하체 근력을 한 번에\n박스에 오를 때마다 허벅지와 엉덩이 근육을 쓰게 돼요.\n숨이 차오르는 유산소를 하면서 하체 힘까지 같이 기를 수 있어요."}, {"t": "p", "v": "② 관절 부담이 적은 편\n오르내리는 동안 한 발은 늘 바닥이나 박스에 닿아 있어요.\n그래서 뛰는 운동보다 무릎과 발목에 오는 충격이 적은 편이에요."}, {"t": "p", "v": "③ 지루하지 않아서 꾸준히 하게 돼요\n음악에 맞춰 동작을 이어가다 보면 시간이 금방 가요.\n혼자 걷기나 러닝머신이 지루해서 그만두셨던 분들도 오래 하시는 경우가 많아요."}, {"t": "img", "v": "img/1021/2.png", "n": "2"}, {"t": "p", "v": "이것만 지키면 더 안전해요\n박스 위에는 앞꿈치만 걸치지 말고 발 전체를 올려주세요.\n내려올 때는 쿵 소리가 나지 않게 뒤꿈치까지 사뿐히 내려오고, 무릎이 안쪽으로 모이지 않게 발끝 방향을 유지해 주세요."}, {"t": "noimg", "v": "이미지3 — GPT", "n": "3"}, {"t": "p", "v": "수업하다 보면 러닝머신 10분도 지루해하시던 회원님들이 스텝박스 1시간은 \"벌써 끝났어요?\" 하실 때가 많아요.\n음악이 있고 옆에서 같이 하는 사람이 있으니 힘든 걸 덜 느끼시는 것 같더라고요."}, {"t": "p", "v": "미즈핏은 평일 오전 10시부터 오후 4시 사이에 1시간짜리 스텝박스 유산소 클래스를 운영하고 있어요.\n그룹PT 수업의 유산소 시 ", "title": "운동은 열심히 하는데 살이 안 빠진다면, 이것부터 확인하세요", "copy": "운동해도 살이 잘 안 빠지는 가장 흔한 이유는 운동한 만큼 더 먹게 되거나, 근력운동 없이 유산소만 하는 경우예요.\n운동 순서도 중요한데, 근력운동을 먼저 하고 유산소를 나중에 하는 게 일반적으로 권장되는 순서예요.\n\n① 운동한 만큼 더 먹고 있지 않나요?\n운동 후에는 배가 더 고프고 \"오늘 운동했으니까\" 하는 마음이 들기 쉬워요.\n1시간 걸어서 쓴 에너지는 빵 하나, 음료 한 잔으로 금방 채워질 수 있어요.\n\n② 유산소만 하고 있지 않나요?\n걷기만 오래 하면 근육은 잘 늘지 않아요.\n근육이 줄면 가만히 있을 때 쓰는 에너지도 줄어서 같은 양을 먹어도 살이 잘 안 빠지는 몸이 되기 쉬워요.\n\n③ 체중계만 보고 있지 않나요?\n근력운동을 시작하면 체중보다 허리둘레나 옷 핏이 먼저 달라지는 경우가 많아요.\n체중계 숫자가 그대로라고 2~3주 만에 그만두기엔 아까워요.\n\n운동 순서는 이렇게\n몸풀기 5~10분 → 근력운동 30분 → 유산소 20~30분 순서로 해보세요.\n힘이 남아 있을 때 근력운동을 해야 바른 자세로 제대로 할 수 있고, 유산소는 그다음에 해도 충분해요.\n\n상담 오시는 분들 중에 \"주 5일 1시간씩 걷는데 그대로예요\"라는 분들이 정말 많으세요.\n그럴 때 먹는 것과 운동 순서를 같이 살펴보면, 대부분 둘 중 하나에서 답이 나오더라고요.\n\n미즈핏 그룹PT는 워밍업과 웨이트 30분, 유산소와 쿨다운 30분 순서로 진행돼요.\n식단관리도 함께 도와드리니 혼자 고민하지 않으셔도 돼요.\n\n운동해도 그대로라 답답하셨다면 채팅으로 \"다이어트\"라고 남겨주세요.\n\n· 김천 여성전용 피트니스 미즈핏\n· 평일 09:00~20:00 / 주말·공휴일은 개인PT만\n· 김천시 평화길 89 2층 (평화시장 공영주차장 맞은편, 김천역 도보 3분)\n· 주차: 평화시장 공영주차장 30분 무료\n· 처음 오시는 분은 무료 상담 (수업 중엔 상담이 어려워 채팅으로 시간 예약 후 방문해 주세요)", "blocks": [{"t": "p", "v": "운동해도 살이 잘 안 빠지는 가장 흔한 이유는 운동한 만큼 더 먹게 되거나, 근력운동 없이 유산소만 하는 경우예요.\n운동 순서도 중요한데, 근력운동을 먼저 하고 유산소를 나중에 하는 게 일반적으로 권장되는 순서예요."}, {"t": "img", "v": "img/1028/1.png", "n": "1"}, {"t": "p", "v": "① 운동한 만큼 더 먹고 있지 않나요?\n운동 후에는 배가 더 고프고 \"오늘 운동했으니까\" 하는 마음이 들기 쉬워요.\n1시간 걸어서 쓴 에너지는 빵 하나, 음료 한 잔으로 금방 채워질 수 있어요."}, {"t": "p", "v": "② 유산소만 하고 있지 않나요?\n걷기만 오래 하면 근육은 잘 늘지 않아요.\n근육이 줄면 가만히 있을 때 쓰는 에너지도 줄어서 같은 양을 먹어도 살이 잘 안 빠지는 몸이 되기 쉬워요."}, {"t": "p", "v": "③ 체중계만 보고 있지 않나요?\n근력운동을 시작하면 체중보다 허리둘레나 옷 핏이 먼저 달라지는 경우가 많아요.\n체중계 숫자가 그대로라고 2~3주 만에 그만두기엔 아까워요."}, {"t": "img", "v": "img/1028/2.png", "n": "2"}, {"t": "p", "v": "운동 순서는 이렇게\n몸풀기 5~10분 → 근력운동 30분 → 유산소 20~30분 순서로 해보세요.\n힘이 남아 있을 때 근력운동을 해야 바른 자세로 제대로 할 수 있고, 유산소는 그다음에 해도 충분해요."}, {"t": "noimg", "v": "이미지3 — GPT", "n": "3"}, {"t": "p", "v": "상담 오시는 분들 중에 \"주 5일 1시간씩 걷는데 그대로예요\"라는 분들이 정말 많으세요.\n그럴 때 먹는 것과 운동 순서를 같이 살펴보면, 대부분 둘 중 하나에서 답이 나오더라고요."}, {"t": "p", "v": "미즈핏 그룹PT는 워밍업과 웨이트
